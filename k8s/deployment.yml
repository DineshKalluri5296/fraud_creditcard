apiVersion: apps/v1
kind: Deployment

metadata:
  name: fraud-api
  namespace: fraud

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fraud-api

  template:
    metadata:
      labels:
        app: fraud-api

    spec:
      containers:

      - name: fraud-api

        image: 690889479874.dkr.ecr.us-east-1.amazonaws.com/frauddetection:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        envFrom:

        - configMapRef:
            name: fraud-config

        - secretRef:
            name: fraud-secret

        resources:

          requests:
            cpu: "250m"
            memory: "256Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
