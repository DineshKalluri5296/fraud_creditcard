name: Fraud MLOps Creditcard

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ACCURACY_THRESHOLD: 0.95

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest

    steps:

      #######################################################
      # CHECKOUT
      #######################################################

      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      #######################################################
      # PYTHON
      #######################################################

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      #######################################################
      # DEPENDENCIES
      #######################################################

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      #######################################################
      # UNIT TESTS
      #######################################################

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          if [ -d tests ]; then
            pytest tests --cov=. --cov-report=xml
          else
            echo "No tests directory found. Skipping tests."
            echo '<?xml version="1.0"?><coverage></coverage>' > coverage.xml
          fi

      #######################################################
      # SONARQUBE ANALYSIS
      #######################################################

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      #######################################################
      # QUALITY GATE
      #######################################################

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      #######################################################
      # AWS LOGIN
      #######################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Login
        run: aws sts get-caller-identity

      #######################################################
      # MODEL REGISTRY
      #######################################################

      - name: Check Existing Model in S3
        id: model
        run: |
          if aws s3 ls s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Existing Model
        if: steps.model.outputs.exists == 'true'
        run: |
          mkdir -p model
          aws s3 cp s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl model/model.pkl

      #######################################################
      # TRAIN MODEL
      #######################################################

      - name: Train Model
        if: steps.model.outputs.exists == 'false'
        run: |
          python model/train.py

      - name: Verify Model
        run: |
          ls -lah model
          find . -name "model.pkl"

      #######################################################
      # EVALUATE MODEL
      #######################################################

      - name: Evaluate Existing Model
        if: steps.model.outputs.exists == 'true'
        id: evaluate
        continue-on-error: true
        run: |
          python model/evaluate.py

      #######################################################
      # RETRAIN
      #######################################################

      - name: Retrain Model
        if: steps.evaluate.outcome == 'failure'
        run: |
          python model/train.py

      #######################################################
      # UPLOAD MODEL
      #######################################################

      - name: Upload Model to S3
        if: steps.model.outputs.exists == 'false' || steps.evaluate.outcome == 'failure'
        run: |
          aws s3 cp model/model.pkl s3://${{ secrets.MODEL_BUCKET }}/model/model.pkl

      #######################################################
      # LOGIN TO ECR
      #######################################################

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      #######################################################
      # BUILD IMAGE
      #######################################################

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          docker build \
            -f docker/Dockerfile \
            -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }} \
            -t $REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest \
            .

      #######################################################
      # PUSH IMAGE
      #######################################################

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          docker push $REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $REGISTRY/${{ secrets.ECR_REPOSITORY }}:latest

      #######################################################
      # EKS DEPLOYMENT
      #######################################################

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER }}

      - name: Verify Cluster
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Create Namespace
        run: |
          kubectl create namespace fraud --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ConfigMap
        run: kubectl apply -f k8s/configmap.yml

      - name: Deploy Secret
        run: kubectl apply -f k8s/secrets.yml

      - name: Update Deployment Image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$REGISTRY/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}|g" k8s/deployment.yml

      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/fraud-api -n fraud --timeout=300s
          kubectl get pods -n fraud
          kubectl get svc -n fraud
